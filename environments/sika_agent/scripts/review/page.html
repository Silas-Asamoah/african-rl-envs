<title>Sika Twi Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; a sticky bar holds progress and filters; each item is a group of phrasing rows with actions on the right. */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --ink: #13201b;
  --muted: #5a6a63;
  --line: #d9e2dd;
  --accent: #0f6b4c;
  --accent-ink: #ffffff;
  --gold: #8a5d00;
  --gold-bg: #f6ead0;
  --good: #1b7543;
  --good-bg: #e0f2e7;
  --fix: #8f5a00;
  --fix-bg: #fbecd2;
  --bad: #ad2a22;
  --bad-bg: #f9e1df;
  --focus: #0f6b4c;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #141c19; --ink: #e5ede9; --muted: #95a59e; --line: #26332e;
    --accent: #52c08f; --accent-ink: #08130e; --gold: #e3b44f; --gold-bg: #33290f;
    --good: #63cf92; --good-bg: #15301f; --fix: #eaab45; --fix-bg: #352611; --bad: #f2867d; --bad-bg: #3a1a17;
    --focus: #52c08f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #141c19; --ink: #e5ede9; --muted: #95a59e; --line: #26332e;
  --accent: #52c08f; --accent-ink: #08130e; --gold: #e3b44f; --gold-bg: #33290f;
  --good: #63cf92; --good-bg: #15301f; --fix: #eaab45; --fix-bg: #352611; --bad: #f2867d; --bad-bg: #3a1a17;
  --focus: #52c08f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.bar .wrap { padding-block: 14px 12px; display: grid; gap: 10px; }
.titleline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.progress { display: grid; gap: 6px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.meter span { display: block; height: 100%; }
.meter .g { background: var(--good); } .meter .f { background: var(--fix); } .meter .r { background: var(--bad); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 5px 11px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.keys { font-size: 12px; color: var(--muted); }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg); color: var(--ink); }
.notice { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--fix-bg); color: var(--fix); font-size: 13px; }
main.wrap { padding-block: 18px 80px; display: grid; gap: 22px; }
.group { display: grid; gap: 8px; }
.ghead { display: grid; gap: 2px; }
.gname { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.gname code { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }
.tag { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.meaning { color: var(--muted); font-size: 13px; max-width: 75ch; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; outline: none; }
.row:focus-visible, .row.cur { box-shadow: 0 0 0 2px var(--focus); }
.row.good { border-color: var(--good); } .row.fix { border-color: var(--fix); } .row.reject { border-color: var(--bad); opacity: 0.8; }
.text { font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
.ph { font-family: var(--font-mono); font-size: 12px; background: var(--gold-bg); color: var(--gold); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.back { color: var(--muted); font-style: italic; font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .machine-no { color: var(--bad); }
.fixed { margin-top: 6px; font-size: 14px; }
.fixed b { color: var(--fix); font-weight: 600; }
.actions { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.actions button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.actions button:hover { border-color: var(--muted); }
.actions button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.actions button.on.g { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.actions button.on.f { background: var(--fix-bg); color: var(--fix); border-color: var(--fix); }
.actions button.on.r { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.actions button:disabled { opacity: 0.5; cursor: default; }
.editor { grid-column: 1 / -1; display: grid; gap: 6px; }
.editor textarea { font: inherit; font-size: 16px; width: 100%; min-height: 72px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.editor .row-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.editor .err { color: var(--bad); font-size: 13px; }
.primary { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.ghost { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .actions { justify-content: flex-start; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: border-color 0.15s, box-shadow 0.15s; } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="titleline">
      <h1>Sika Twi Review</h1>
      <span class="sub" id="status">Connecting to the review store…</span>
    </div>
    <div class="progress">
      <div class="meter" aria-hidden="true"><span class="g" id="m-g"></span><span class="f" id="m-f"></span><span class="r" id="m-r"></span></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-tw" data-lang="tw" aria-pressed="true">Twi</button>
        <button type="button" id="lang-entw" data-lang="en-tw" aria-pressed="true">Twi–English</button>
      </div>
      <label class="sub" for="kind">Kind
        <select id="kind">
          <option value="all">All</option>
          <option value="requests">User requests</option>
          <option value="replies">Scripted replies</option>
          <option value="injections">Planted scam texts</option>
        </select>
      </label>
      <label class="sub" for="show">Show
        <select id="show">
          <option value="todo">To review</option>
          <option value="kept">All the checker kept</option>
          <option value="rejected">Checker rejected (rescue good ones)</option>
          <option value="done">Reviewed</option>
          <option value="all">Everything</option>
        </select>
      </label>
      <span class="keys"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>g</kbd> good · <kbd>f</kbd> fix · <kbd>r</kbd> reject</span>
    </div>
  </div>
</header>

<main class="wrap" id="list"></main>

<script type="application/json" id="items">/*__ITEMS__*/</script>
<script>
(function () {
  const ITEMS = JSON.parse(document.getElementById("items").textContent);
  const LANG = { tw: "Twi", "en-tw": "Twi–English" };
  const KIND = { requests: "User request", replies: "Scripted reply", injections: "Planted scam text" };
  const SOURCE = { opus: "Claude Opus 5.5", argon: "Gemini 4 Argon", gpt: "GPT-5.4", seed: "Hand-written seed" };
  const verdicts = new Map();
  const queues = new Map();
  let db = null, canSave = false, editing = null, cursor = null;
  const state = { langs: new Set(["tw", "en-tw"]), kind: "all", show: "todo" };

  const $ = (id) => document.getElementById(id);
  const placeholders = (t) => (t.match(/\{(\w+)\}/g) || []).slice().sort().join(",");

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function withChips(text) {
    const frag = document.createDocumentFragment();
    text.split(/(\{\w+\})/).forEach((part) => {
      if (/^\{\w+\}$/.test(part)) frag.appendChild(el("span", "ph", part.slice(1, -1)));
      else if (part) frag.appendChild(document.createTextNode(part));
    });
    return frag;
  }

  function visible(item) {
    if (!state.langs.has(item.language)) return false;
    if (state.kind !== "all" && item.kind !== state.kind) return false;
    const v = verdicts.get(item.key);
    switch (state.show) {
      case "todo": return item.kept && !v;
      case "kept": return item.kept;
      case "rejected": return !item.kept;
      case "done": return !!v;
      default: return true;
    }
  }

  function renderCounts() {
    const kept = ITEMS.filter((i) => i.kept);
    let g = 0, f = 0, r = 0, rescued = 0;
    for (const i of ITEMS) {
      const v = verdicts.get(i.key);
      if (!v) continue;
      if (!i.kept && v.verdict !== "reject") rescued++;
      if (!i.kept) continue;
      if (v.verdict === "good") g++; else if (v.verdict === "fix") f++; else if (v.verdict === "reject") r++;
    }
    const total = kept.length || 1;
    $("m-g").style.width = (100 * g / total) + "%";
    $("m-f").style.width = (100 * f / total) + "%";
    $("m-r").style.width = (100 * r / total) + "%";
    const c = $("counts");
    c.textContent = "";
    const add = (label, n) => { const s = el("span"); const b = el("b", null, String(n)); s.append(b, " " + label); c.appendChild(s); };
    add("of " + kept.length + " reviewed", g + f + r);
    add("good", g); add("fixed", f); add("rejected", r);
    add("rescued from the checker's rejects", rescued);
  }

  function row(item) {
    const v = verdicts.get(item.key);
    const r = el("article", "row" + (v ? " " + v.verdict : ""));
    r.tabIndex = 0;
    r.dataset.key = item.key;
    if (cursor === item.key) r.classList.add("cur");
    const body = el("div");
    const t = el("div", "text"); t.appendChild(withChips(item.text)); body.appendChild(t);
    if (item.english) body.appendChild(el("div", "back", "“" + item.english + "”"));
    const meta = el("div", "meta");
    meta.appendChild(el("span", null, SOURCE[item.source] || item.source));
    if (item.natural) meta.appendChild(el("span", null, "Natural " + item.natural + "/5 (" + (SOURCE[item.checker] || item.checker) + ")"));
    if (item.split) meta.appendChild(el("span", null, item.split === "eval" ? "Held-out eval" : "Train"));
    if (!item.kept) meta.appendChild(el("span", "machine-no", "Checker rejected" + (item.reason ? ": " + item.reason : "")));
    body.appendChild(meta);
    if (v && v.verdict === "fix" && v.text) {
      const fx = el("div", "fixed"); fx.appendChild(el("b", null, "Your fix: ")); fx.appendChild(withChips(v.text)); body.appendChild(fx);
    }
    r.appendChild(body);
    const acts = el("div", "actions");
    [["good", "Good", "g"], ["fix", "Fix", "f"], ["reject", "Reject", "r"]].forEach(([verdict, label, cls]) => {
      const b = el("button", cls + (v && v.verdict === verdict ? " on" : ""), label);
      b.type = "button";
      b.disabled = !canSave;
      b.addEventListener("click", () => act(item, verdict));
      acts.appendChild(b);
    });
    r.appendChild(acts);
    if (editing === item.key) r.appendChild(editor(item, v));
    r.addEventListener("focus", () => { cursor = item.key; markCursor(); });
    return r;
  }

  function editor(item, v) {
    const box = el("div", "editor");
    const ta = el("textarea");
    ta.id = "fix-" + item.key;
    ta.value = (v && v.text) || item.text;
    ta.setAttribute("aria-label", "Corrected wording");
    const err = el("span", "err");
    const btns = el("div", "row-btns");
    const save = el("button", "primary", "Save fix"); save.type = "button";
    const cancel = el("button", "ghost", "Cancel"); cancel.type = "button";
    const hint = el("span", "sub", "Keep the placeholders exactly: " + (placeholders(item.text) || "none"));
    save.addEventListener("click", () => {
      const text = ta.value.trim();
      if (!text) { err.textContent = "Write the corrected wording, or use Reject instead."; return; }
      if (placeholders(text) !== placeholders(item.text)) {
        err.textContent = "The placeholders changed. Keep each of {" + (placeholders(item.text).replace(/,/g, "}, {") || "") + "} exactly once.";
        return;
      }
      editing = null;
      write(item, { verdict: "fix", text });
    });
    cancel.addEventListener("click", () => { editing = null; render(); });
    ta.addEventListener("keydown", (e) => { if (e.key === "Escape") { editing = null; render(); } e.stopPropagation(); });
    btns.append(save, cancel, hint);
    box.append(ta, btns, err);
    setTimeout(() => ta.focus(), 0);
    return box;
  }

  function act(item, verdict) {
    if (!canSave) return;
    if (verdict === "fix") { editing = item.key; cursor = item.key; render(); return; }
    const current = verdicts.get(item.key);
    if (current && current.verdict === verdict) return;
    write(item, { verdict });
  }

  function write(item, body) {
    const doc = Object.assign({ verdict: body.verdict, at: new Date().toISOString() }, body.text ? { text: body.text } : {});
    verdicts.set(item.key, doc);
    render();
    const prev = queues.get(item.key) || Promise.resolve();
    const next = prev.then(() => db.collection("verdicts").doc(item.key).set(doc)).catch((e) => {
      $("status").textContent = "Couldn't save the last change (" + (e && e.code ? e.code : "error") + "). Try again.";
    });
    queues.set(item.key, next);
  }

  function render() {
    renderCounts();
    const list = $("list");
    list.textContent = "";
    const groups = new Map();
    for (const item of ITEMS) {
      if (!visible(item)) continue;
      const g = item.kind + "/" + item.name + "/" + item.language;
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(item);
    }
    if (!groups.size) {
      list.appendChild(el("p", "empty", state.show === "todo" ? "Nothing left to review with these filters." : "No phrasings match these filters."));
      return;
    }
    for (const [, items] of groups) {
      const first = items[0];
      const g = el("section", "group");
      const head = el("div", "ghead");
      const name = el("div", "gname");
      name.appendChild(el("code", null, first.name));
      name.appendChild(el("span", "tag", KIND[first.kind] + " · " + LANG[first.language]));
      head.appendChild(name);
      const m = el("div", "meaning"); m.appendChild(document.createTextNode("Must say: ")); m.appendChild(withChips(first.meaning)); head.appendChild(m);
      g.appendChild(head);
      items.forEach((i) => g.appendChild(row(i)));
      list.appendChild(g);
    }
  }

  function rows() { return Array.from(document.querySelectorAll(".row")); }
  function markCursor() { rows().forEach((r) => r.classList.toggle("cur", r.dataset.key === cursor)); }
  function move(step) {
    const rs = rows(); if (!rs.length) return;
    let i = rs.findIndex((r) => r.dataset.key === cursor);
    i = i < 0 ? 0 : Math.max(0, Math.min(rs.length - 1, i + step));
    cursor = rs[i].dataset.key; rs[i].focus(); markCursor();
  }
  document.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const item = ITEMS.find((i) => i.key === cursor);
    if (e.key === "j") { move(1); e.preventDefault(); }
    else if (e.key === "k") { move(-1); e.preventDefault(); }
    else if (item && (e.key === "g" || e.key === "r")) {
      e.preventDefault();
      const at = rows().findIndex((r) => r.dataset.key === cursor);
      act(item, e.key === "g" ? "good" : "reject");
      const rs = rows();
      if (!rs.length) return;
      const stays = rs.some((r) => r.dataset.key === item.key);
      const next = rs[Math.min(stays ? at + 1 : at, rs.length - 1)];
      cursor = next.dataset.key; next.focus(); markCursor();
    } else if (item && e.key === "f") { act(item, "fix"); e.preventDefault(); }
  });

  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    const lang = b.dataset.lang;
    if (state.langs.has(lang) && state.langs.size > 1) state.langs.delete(lang); else state.langs.add(lang);
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(state.langs.has(x.dataset.lang))));
    render();
  }));
  $("kind").addEventListener("change", (e) => { state.kind = e.target.value; render(); });
  $("show").addEventListener("change", (e) => { state.show = e.target.value; render(); });

  render();

  const start = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
  start.then((store) => {
    if (!store) {
      $("status").textContent = "Saving isn't available in this view, so choices here won't be kept.";
      return;
    }
    db = store; canSave = true;
    $("status").textContent = "Choices save as you go.";
    db.collection("verdicts").onSnapshot((snap) => {
      verdicts.clear();
      snap.docs.forEach((d) => { if (d.exists) verdicts.set(d.id, d.data()); });
      if (!editing) render(); else renderCounts();
    }, (e) => {
      canSave = false;
      $("status").textContent = "The review store disconnected (" + e.code + "). Reload to keep reviewing.";
      render();
    });
    render();
  }).catch(() => { $("status").textContent = "Saving isn't available in this view, so choices here won't be kept."; });
})();
</script>
