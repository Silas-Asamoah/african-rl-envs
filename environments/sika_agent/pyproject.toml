[project]
name = "sika-agent"
version = "0.2.1"
description = "Sika Agent: a Ghanaian mobile money and pay-as-you-go credit agent environment, scored on the final wallet state, with hard penalties for harmful actions."
tags = ["agent", "tool-use", "multi-turn", "finance", "mobile-money", "ghana", "twi", "africa", "safety", "prompt-injection"]
requires-python = ">=3.11,<3.15"
dependencies = ["verifiers>=0.4.0"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sika_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
