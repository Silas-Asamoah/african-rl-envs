[project]
name = "sika-interp"
version = "0.1.0"
description = "Looking inside open models as they handle sika-agent tasks in English, Twi and Twi–English."
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["sika-agent"]

[tool.uv.sources]
sika-agent = { path = "../../environments/sika_agent", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sika_interp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
